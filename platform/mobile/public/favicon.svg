<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RobustUAVs.ai">
  <!--
    Built from the hand-drawn sketch: stacked horizontal strokes whose arrowheads
    converge from both sides. That is the project's thesis as a mark rather than a
    picture of a drone -- the network layer running one way, the autonomy layer the
    other, meeting at a single interface in the middle.

    The convergence point is the delta: the perturbation the composition theorem
    carries across that interface. Reading outward from it, the strokes lengthen,
    which also gives the silhouette of a swept airframe seen from above.

    Two colours only, both from the app palette (network blue, autonomy green),
    with the meeting point in the accent. Legible at 16 px because every stroke is
    at least 3 units wide and nothing relies on hue alone.
  -->
  <rect width="64" height="64" rx="13" fill="#0F172A"/>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- network layer: flowing right, meeting the centre -->
    <g stroke="#3B82F6" stroke-width="3.2">
      <path d="M7 18 H23"/>
      <path d="M5 27 H26"/>
      <path d="M8 36 H23"/>
      <path d="M11 45 H20"/>
      <path d="M20.5 24.5 L26.5 27 L20.5 29.5"/>
      <path d="M17.5 33.5 L23.5 36 L17.5 38.5"/>
    </g>

    <!-- autonomy layer: flowing left, meeting the same point -->
    <g stroke="#22C55E" stroke-width="3.2">
      <path d="M57 18 H41"/>
      <path d="M59 27 H38"/>
      <path d="M56 36 H41"/>
      <path d="M53 45 H44"/>
      <path d="M43.5 24.5 L37.5 27 L43.5 29.5"/>
      <path d="M46.5 33.5 L40.5 36 L46.5 38.5"/>
    </g>

    <!-- the interface: where theta becomes delta -->
    <path d="M32 20 L32 44" stroke="#F97316" stroke-width="3.4"/>
    <circle cx="32" cy="31.5" r="4.6" fill="#F97316" stroke="none"/>
    <circle cx="32" cy="31.5" r="1.9" fill="#0F172A" stroke="none"/>
  </g>
</svg>
